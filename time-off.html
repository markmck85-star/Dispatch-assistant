<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Days Off — MCR</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #f4f6f8; color: #1c2834; }
  header { background: #16324f; color: #fff; padding: 16px 20px; }
  header a { color: #d6e6f5; }
  main { max-width: 920px; margin: 0 auto; padding: 18px 16px 40px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 14px; }
  button, select { min-height: 40px; border-radius: 8px; border: 1px solid #c5d0da; background: #fff; padding: 8px 12px; font-weight: 650; }
  button.primary { background: #16324f; color: #fff; border-color: #16324f; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #5c6b7a; font-size: 13px; margin: 0 0 14px; }
  .period { font-size: 18px; font-weight: 750; margin: 0 0 12px; }
  .card { background: #fff; border: 1px solid #d7e0e8; border-radius: 10px; margin: 0 0 10px; overflow: hidden; }
  .card h2 { margin: 0; padding: 10px 12px; background: #eef3f7; font-size: 16px; display: flex; justify-content: space-between; gap: 8px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 12px; border-top: 1px solid #e6edf3; font-size: 14px; }
  th { color: #5c6b7a; font-size: 12px; }
  .empty, .err { padding: 14px; color: #5c6b7a; }
  .err { color: #9b2c2c; }
  .tag { font-size: 11px; font-weight: 700; color: #1f6f78; }
</style>
</head>
<body>
<header>
  <div style="font-size:13px;margin-bottom:6px;"><a href="/">Dispatch</a> · <a href="/calendar">Calendar</a> · <a href="/mileage">Mileage check</a> · <a href="/inventory-board">Inventory</a></div>
  <h1>Days off by pay period</h1>
</header>
<main>
  <p class="sub">Same Sunday-to-Saturday pay period as the mileage log. Calendar time off, plus the standing on-call comp day when that week has no calendar comp day.</p>
  <div class="bar">
    <button type="button" id="prevBtn">Previous</button>
    <button type="button" id="nextBtn">Next</button>
    <button type="button" id="thisBtn">This period</button>
    <button type="button" class="primary" id="pdfBtn">Save as PDF / Print</button>
  </div>
  <div class="period" id="periodLabel"></div>
  <div id="out" class="empty">Loading…</div>
</main>
<script>
const REASON = { vacation: 'Vacation', personal: 'Personal', pto: 'PTO', comp_day: 'Comp day', manual: 'Out', other: 'Out', last_day: 'Last day', info: 'Note', site_survey: 'Site survey' };
let periodStart = '';

function iso(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function sundayOf(d) {
  const x = new Date(d);
  x.setDate(x.getDate() - x.getDay());
  return iso(x);
}
function addDays(dateStr, n) {
  const x = new Date(dateStr + 'T12:00:00');
  x.setDate(x.getDate() + n);
  return iso(x);
}
function pretty(dateStr) {
  const x = new Date(dateStr + 'T12:00:00');
  return x.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}
function standingCompDay(sat, name) {
  return addDays(sat, /robert medley/i.test(name || '') ? -2 : -5);
}
function esc(s) {
  return String(s || '').replace(/[&<>"]/g, c => ({ '&': '&', '<': '<', '>': '>', '"': '"' }[c]));
}

async function load() {
  const end = addDays(periodStart, 13);
  document.getElementById('periodLabel').textContent = pretty(periodStart) + ' – ' + pretty(end) + ', ' + end.slice(0, 4);
  const out = document.getElementById('out');
  out.className = 'empty';
  out.textContent = 'Loading…';
  try {
    const [availRes, onRes] = await Promise.all([
      fetch('/.netlify/functions/get-tech-availability?startDate=' + periodStart + '&endDate=' + end),
      fetch('/.netlify/functions/get-on-call?since=' + addDays(periodStart, -6) + '&until=' + addDays(end, 6))
    ]);
    if (!availRes.ok) throw new Error('Days off did not load');
    const avail = await availRes.json();
    const onCall = onRes.ok ? await onRes.json() : { entries: [] };
    const rows = (avail.availability || []).map(r => ({
      name: r.techName,
      day: r.day,
      reason: REASON[r.reason] || r.reason || 'Out',
      note: r.note || '',
      source: 'Calendar'
    })).filter(r => r.day >= periodStart && r.day <= end && r.reason !== 'Note' && r.reason !== 'Site survey');

    const explicit = new Set(rows.filter(r => r.reason === 'Comp day').map(r => r.name + '|' + r.day));
    const weekHasExplicit = new Set();
    rows.forEach(r => { if (r.reason === 'Comp day') weekHasExplicit.add(r.name); });
    (onCall.entries || []).forEach(entry => {
      if (!entry.day || !entry.technician) return;
      const weekStart = addDays(entry.day, -5);
      const weekEnd = addDays(entry.day, -1);
      const hasExplicit = rows.some(r => r.name === entry.technician && r.reason === 'Comp day' && r.day >= weekStart && r.day <= weekEnd);
      if (hasExplicit) return;
      const day = standingCompDay(entry.day, entry.technician);
      if (day < periodStart || day > end) return;
      if (explicit.has(entry.technician + '|' + day)) return;
      rows.push({ name: entry.technician, day, reason: 'Comp day', note: 'Standing, on call Sat ' + pretty(entry.day), source: 'On-call' });
    });

    const byName = new Map();
    rows.sort((a, b) => a.name.localeCompare(b.name) || a.day.localeCompare(b.day));
    rows.forEach(r => {
      if (!byName.has(r.name)) byName.set(r.name, []);
      byName.get(r.name).push(r);
    });
    window._daysOff = { start: periodStart, end, groups: [...byName.entries()] };
    if (!byName.size) {
      out.textContent = 'No days off in this pay period.';
      return;
    }
    out.className = '';
    out.innerHTML = [...byName.entries()].map(([name, list]) =>
      '<section class="card"><h2>' + esc(name) + '<span>' + list.length + '</span></h2><table><tr><th>Day</th><th>Reason</th><th>Note</th></tr>' +
      list.map(r => '<tr><td>' + esc(pretty(r.day)) + '</td><td>' + esc(r.reason) + (r.source === 'On-call' ? ' <span class="tag">standing</span>' : '') + '</td><td>' + esc(r.note) + '</td></tr>').join('') +
      '</table></section>'
    ).join('');
  } catch (err) {
    out.className = 'err';
    out.textContent = err.message;
  }
}

function printPdf() {
  const data = window._daysOff;
  if (!data || !data.groups.length) { alert('Nothing to print for this pay period.'); return; }
  const rows = data.groups.map(([name, list]) =>
    '<h3>' + esc(name) + ' (' + list.length + ')</h3><table><tr><th>Day</th><th>Reason</th><th>Note</th></tr>' +
    list.map(r => '<tr><td>' + esc(pretty(r.day)) + '</td><td>' + esc(r.reason) + (r.source === 'On-call' ? ' (standing)' : '') + '</td><td>' + esc(r.note) + '</td></tr>').join('') +
    '</table>'
  ).join('');
  const html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Days off ' + data.start + '</title>' +
    '<style>body{font-family:Arial,sans-serif;padding:16px;font-size:13px;} table{border-collapse:collapse;width:100%;margin:0 0 16px;} td,th{border:1px solid #999;padding:4px;text-align:left;} h2,h3{margin:12px 0 6px;} .btn{margin-bottom:12px;}</style></head><body>' +
    '<button class="btn" onclick="window.print()">Save as PDF / Print</button>' +
    '<h2>MCR Technical Service, LLC</h2><h3>Days off — ' + pretty(data.start) + ' to ' + pretty(data.end) + '</h3>' +
    rows + '</body></html>';
  const w = window.open('', '_blank');
  if (!w) { alert('Allow pop-ups to open the PDF view.'); return; }
  w.document.write(html);
  w.document.close();
}

document.getElementById('prevBtn').onclick = () => { periodStart = addDays(periodStart, -14); load(); };
document.getElementById('nextBtn').onclick = () => { periodStart = addDays(periodStart, 14); load(); };
document.getElementById('thisBtn').onclick = () => { periodStart = sundayOf(new Date()); load(); };
document.getElementById('pdfBtn').onclick = printPdf;
periodStart = sundayOf(new Date());
load();
</script>
</body>
</html>
