<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Days off by pay period</title>
<style>
  :root { --ink:#16324f; --paper:#f3f6f8; --card:#fff; --line:#d5e0e8; --muted:#5c6b7a; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: var(--paper); color: #1c2834; }
  header { background: linear-gradient(180deg, #1b3d5c 0%, #16324f 100%); color: #fff; padding: 22px 28px 18px; }
  header a { color: #d6e6f5; text-decoration: none; }
  header a:hover { text-decoration: underline; }
  .kicker { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #b7c9da; margin-bottom: 8px; }
  h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.02em; }
  main { max-width: 1100px; margin: 0 auto; padding: 22px 24px 48px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; max-width: 720px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 16px; }
  button, select { min-height: 40px; border-radius: 8px; border: 1px solid #c5d0da; background: #fff; padding: 8px 12px; font-weight: 650; cursor: pointer; }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .period { font-size: 18px; font-weight: 750; margin: 0 0 12px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 0 0 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat b { display: block; font-size: 26px; letter-spacing: -0.03em; color: var(--ink); }
  .stat span { color: var(--muted); font-size: 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 0 rgba(22,50,79,.04); }
  .card h2 { margin: 0; padding: 12px 14px; background: #eef3f7; font-size: 16px; display: flex; justify-content: space-between; gap: 8px; }
  .card h2 span { font-variant-numeric: tabular-nums; color: var(--ink); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 14px; border-top: 1px solid #e6edf3; font-size: 14px; }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .empty, .err { padding: 14px; color: var(--muted); }
  .err { color: #9b2c2c; }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #eef3f7; }
  .pill.vacation { background: #e7f0e4; color: #24613a; }
  .pill.comp { background: #e5f3f4; color: #1f6f78; }
  .pill.out { background: #f8eee6; color: #8a4b12; }
  .tag { font-size: 11px; font-weight: 700; color: #1f6f78; }
  @media (max-width: 800px) {
    header, main { padding-left: 16px; padding-right: 16px; }
    h1 { font-size: 22px; }
    .stats, .grid { grid-template-columns: 1fr; }
  }
  @media print {
    header { background: #fff; color: #000; }
    header a { color: #000; }
    .bar, .kicker { display: none; }
    .grid { display: block; }
    .card { break-inside: avoid; margin-bottom: 10px; }
  }
</style>
</head>
<body>
<header>
  <div class="kicker"><a href="/">Dispatch</a> · <a href="/calendar">Calendar</a> · <a href="/mileage">Mileage check</a> · <a href="/inventory-board">Inventory</a></div>
  <h1>Days off by pay period</h1>
</header>
<main>
  <p class="sub">Same Sunday-to-Saturday pay period as the mileage log. Calendar time off, plus the standing on-call comp day when that week has no calendar comp day.</p>
  <div class="bar">
    <button type="button" id="prevBtn">Previous</button>
    <button type="button" id="nextBtn">Next</button>
    <button type="button" id="thisBtn">This period</button>
    <button type="button" class="primary" id="pdfBtn">Save as PDF / Print</button>
  </div>
  <div class="period" id="periodLabel"></div>
  <div id="out" class="empty">Loading…</div>
</main>
<script>
const REASON = { vacation: 'Vacation', personal: 'Personal', pto: 'PTO', comp_day: 'Comp day', manual: 'Out', other: 'Out', last_day: 'Last day', info: 'Note', site_survey: 'Site survey' };
let periodStart = '';

function iso(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function sundayOf(d) {
  const x = new Date(d);
  x.setDate(x.getDate() - x.getDay());
  return iso(x);
}
function addDays(dateStr, n) {
  const x = new Date(dateStr + 'T12:00:00');
  x.setDate(x.getDate() + n);
  return iso(x);
}
function pretty(dateStr) {
  const x = new Date(dateStr + 'T12:00:00');
  return x.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}
function standingCompDay(sat, name) {
  return addDays(sat, /robert medley/i.test(name || '') ? -2 : -5);
}
function esc(s) {
  return String(s || '').replace(/[&<>"]/g, c => ({ '&': '&', '<': '<', '>': '>', '"': '"' }[c]));
}
function pillClass(reason) {
  if (reason === 'Vacation' || reason === 'PTO') return 'vacation';
  if (reason === 'Comp day') return 'comp';
  return 'out';
}

async function load() {
  const end = addDays(periodStart, 13);
  document.getElementById('periodLabel').textContent = pretty(periodStart) + ' – ' + pretty(end) + ', ' + end.slice(0, 4);
  const out = document.getElementById('out');
  out.className = 'empty';
  out.textContent = 'Loading…';
  try {
    const [availRes, onRes] = await Promise.all([
      fetch('/.netlify/functions/get-tech-availability?startDate=' + periodStart + '&endDate=' + end),
      fetch('/.netlify/functions/get-on-call?since=' + addDays(periodStart, -6) + '&until=' + addDays(end, 6))
    ]);
    if (!availRes.ok) throw new Error('Days off did not load');
    const avail = await availRes.json();
    const onCall = onRes.ok ? await onRes.json() : { entries: [] };
    const rows = (avail.availability || []).map(r => ({
      name: r.techName,
      day: r.day,
      reason: REASON[r.reason] || r.reason || 'Out',
      note: r.note || '',
      source: 'Calendar'
    })).filter(r => r.day >= periodStart && r.day <= end && r.reason !== 'Note' && r.reason !== 'Site survey');

    const explicit = new Set(rows.filter(r => r.reason === 'Comp day').map(r => r.name + '|' + r.day));
    const weekHasExplicit = new Set();
    rows.forEach(r => { if (r.reason === 'Comp day') weekHasExplicit.add(r.name); });
    (onCall.entries || []).forEach(entry => {
      if (!entry.day || !entry.technician) return;
      const weekStart = addDays(entry.day, -5);
      const weekEnd = addDays(entry.day, -1);
      const hasExplicit = rows.some(r => r.name === entry.technician && r.reason === 'Comp day' && r.day >= weekStart && r.day <= weekEnd);
      if (hasExplicit) return;
      const day = standingCompDay(entry.day, entry.technician);
      if (day < periodStart || day > end) return;
      if (explicit.has(entry.technician + '|' + day)) return;
      rows.push({ name: entry.technician, day, reason: 'Comp day', note: 'Standing, on call Sat ' + pretty(entry.day), source: 'On-call' });
    });

    const byName = new Map();
    rows.sort((a, b) => a.name.localeCompare(b.name) || a.day.localeCompare(b.day));
    rows.forEach(r => {
      if (!byName.has(r.name)) byName.set(r.name, []);
      byName.get(r.name).push(r);
    });
    window._daysOff = { start: periodStart, end, groups: [...byName.entries()] };
    if (!byName.size) {
      out.textContent = 'No days off in this pay period.';
      return;
    }
    out.className = '';
    const all = [...byName.values()].flat();
    const vac = all.filter(r => r.reason === 'Vacation').length;
    const comp = all.filter(r => r.reason === 'Comp day').length;
    const stats = '<div class="stats">' +
      '<div class="stat"><b>' + byName.size + '</b><span>People with time off</span></div>' +
      '<div class="stat"><b>' + all.length + '</b><span>Days in this period</span></div>' +
      '<div class="stat"><b>' + vac + '</b><span>Vacation days</span></div>' +
      '<div class="stat"><b>' + comp + '</b><span>Comp days</span></div></div>';
    const cards = [...byName.entries()].map(([name, list]) =>
      '<section class="card"><h2>' + esc(name) + '<span>' + list.length + '</span></h2><table><tr><th>Day</th><th>Reason</th><th>Note</th></tr>' +
      list.map(r => '<tr><td>' + esc(pretty(r.day)) + '</td><td><span class="pill ' + pillClass(r.reason) + '">' + esc(r.reason) + '</span>' + (r.source === 'On-call' ? ' <span class="tag">standing</span>' : '') + '</td><td>' + esc(r.note) + '</td></tr>').join('') +
      '</table></section>'
    ).join('');
    out.innerHTML = stats + '<div class="grid">' + cards + '</div>';
  } catch (err) {
    out.className = 'err';
    out.textContent = err.message;
  }
}

function printPdf() {
  const data = window._daysOff;
  if (!data || !data.groups.length) { alert('Nothing to print for this pay period.'); return; }
  const rows = data.groups.map(([name, list]) =>
    '<h3>' + esc(name) + ' (' + list.length + ')</h3><table><tr><th>Day</th><th>Reason</th><th>Note</th></tr>' +
    list.map(r => '<tr><td>' + esc(pretty(r.day)) + '</td><td>' + esc(r.reason) + (r.source === 'On-call' ? ' (standing)' : '') + '</td><td>' + esc(r.note) + '</td></tr>').join('') +
    '</table>'
  ).join('');
  const html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Days off ' + data.start + '</title>' +
    '<style>body{font-family:Arial,sans-serif;padding:16px;font-size:13px;} table{border-collapse:collapse;width:100%;margin:0 0 16px;} td,th{border:1px solid #999;padding:4px;text-align:left;} h2,h3{margin:12px 0 6px;} .btn{margin-bottom:12px;}</style></head><body>' +
    '<button class="btn" onclick="window.print()">Save as PDF / Print</button>' +
    '<h2>MCR Technical Service, LLC</h2><h3>Days off, ' + pretty(data.start) + ' to ' + pretty(data.end) + '</h3>' +
    rows + '</body></html>';
  const w = window.open('', '_blank');
  if (!w) { alert('Allow pop-ups to open the PDF view.'); return; }
  w.document.write(html);
  w.document.close();
}

document.getElementById('prevBtn').onclick = () => { periodStart = addDays(periodStart, -14); load(); };
document.getElementById('nextBtn').onclick = () => { periodStart = addDays(periodStart, 14); load(); };
document.getElementById('thisBtn').onclick = () => { periodStart = sundayOf(new Date()); load(); };
document.getElementById('pdfBtn').onclick = printPdf;
periodStart = sundayOf(new Date());
load();
</script>
</body>
</html>
