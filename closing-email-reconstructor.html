<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Closing Email Reconstructor — MCR Dispatch</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0; padding: 16px;
        background: #14161a; color: #e8e8e8;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .subtitle { color: #9aa0a6; font-size: 14px; margin-bottom: 18px; }
    a.back-link { color: #6cb2ff; text-decoration: none; font-size: 14px; }
    .filters {
        display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
        background: #1e2126; border: 1px solid #2c2f36; border-radius: 10px;
        padding: 14px; margin: 16px 0;
    }
    .filters label { font-size: 13px; color: #b8bcc2; }
    select, input[type=text] {
        background: #14161a; color: #e8e8e8; border: 1px solid #3a3e46;
        border-radius: 6px; padding: 8px 10px; font-size: 14px;
    }
    .search-wrap { position: relative; flex: 1; min-width: 220px; }
    .results-dropdown {
        position: absolute; top: 100%; left: 0; right: 0; z-index: 20;
        background: #1e2126; border: 1px solid #3a3e46; border-top: none;
        border-radius: 0 0 8px 8px; max-height: 320px; overflow-y: auto;
        display: none;
    }
    .results-dropdown.open { display: block; }
    .result-row { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #22252b; font-size: 13.5px; }
    .result-row:hover, .result-row.active { background: #262a31; }
    .result-row .code { color: #6cb2ff; font-weight: 600; margin-right: 8px; }
    .result-row .state-tag {
        display: inline-block; font-size: 11px; font-weight: 700; color: #7ec4ff;
        background: #24303f; padding: 1px 6px; border-radius: 4px; margin-right: 8px;
    }
    .card {
        background: #1e2126; border: 1px solid #2c2f36; border-radius: 10px;
        padding: 18px; margin-top: 18px;
    }
    .card h2 { font-size: 18px; margin: 0 0 4px; }
    .card .meta { color: #9aa0a6; font-size: 13px; margin-bottom: 14px; }
    h3.section-label { font-size: 13px; color: #b8bcc2; margin: 18px 0 6px; text-transform: uppercase; letter-spacing: 0.04em; }
    .visit-row {
        padding: 10px 12px; border-bottom: 1px solid #22252b; font-size: 13.5px;
        cursor: pointer; border-radius: 6px;
    }
    .visit-row:hover { background: #262a31; }
    .visit-row:last-child { border-bottom: none; }
    .visit-row.no-note { cursor: not-allowed; opacity: 0.45; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: #c7cad1; }
    .muted { color: #7a7f87; }
    .note-badge { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
    .note-badge.yes { color: #7edb8e; background: #16321f; }
    .note-badge.no { color: #7a7f87; background: #24272d; }
    .empty-state, .loading { text-align: center; color: #7a7f87; padding: 20px 0; }
    textarea#emailOutput {
        width: 100%; min-height: 380px; background: #14161a; color: #e8e8e8;
        border: 1px solid #3a3e46; border-radius: 8px; padding: 12px; font-size: 13px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; line-height: 1.5; resize: vertical;
    }
    input#subjectOutput {
        width: 100%; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; margin-bottom: 8px;
    }
    button.primary-btn {
        background: #2e7d5b; color: #fff; border: none; border-radius: 6px;
        padding: 10px 16px; font-size: 14px; cursor: pointer; margin-top: 10px;
    }
    button.secondary-btn {
        background: #2a2a3e; color: #ccc; border: 1px solid #555; border-radius: 6px;
        padding: 10px 16px; font-size: 14px; cursor: pointer; margin-top: 10px; margin-left: 8px;
    }
</style>
</head>
<body>
    <a href="/" class="back-link">← Back to Dispatch Tool</a>
    <h1>✉️ Closing Email Reconstructor</h1>
    <div class="subtitle">Neumo no longer sends closing emails for kiosk service calls. This rebuilds one in the old TechWeb-style format using a captured Salesforce closing note.</div>

    <div class="filters">
        <label>State:</label>
        <select id="stateFilter"><option value="">All states</option></select>
        <div class="search-wrap">
            <input type="text" id="searchInput" placeholder="Search by name or site code…" autocomplete="off">
            <div class="results-dropdown" id="resultsDropdown"></div>
        </div>
    </div>

    <div id="output"></div>
    <div id="emailCard"></div>

<script>
let allSites = [];
let filteredResults = [];
let siteVisits = [];

const stateFilter = document.getElementById('stateFilter');
const searchInput = document.getElementById('searchInput');
const resultsDropdown = document.getElementById('resultsDropdown');
const output = document.getElementById('output');
const emailCard = document.getElementById('emailCard');

function escapeHtml(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function loadSites() {
    output.innerHTML = '<div class="loading">Loading site list…</div>';
    try {
        const res = await fetch('/.netlify/functions/get-site-list');
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || ('HTTP ' + res.status));
        allSites = data.sites || [];
        const states = [...new Set(allSites.map(s => s.state))].sort();
        for (const st of states) {
            const opt = document.createElement('option');
            opt.value = st; opt.textContent = st;
            stateFilter.appendChild(opt);
        }
        output.innerHTML = `<div class="empty-state">${allSites.length} sites loaded. Search above, then pick a visit with a captured closing note.</div>`;
    } catch (err) {
        output.innerHTML = `<div class="empty-state" style="color:#ff9a9a;">Error loading site list: ${err.message}</div>`;
    }
}
loadSites();

function runSearch() {
    const q = searchInput.value.trim().toLowerCase();
    const st = stateFilter.value;
    if (!q) { resultsDropdown.classList.remove('open'); resultsDropdown.innerHTML = ''; return; }
    filteredResults = allSites.filter(s =>
        (!st || s.state === st) &&
        ((s.name || '').toLowerCase().includes(q) || (s.site_code || '').toLowerCase().includes(q))
    ).slice(0, 30);
    if (!filteredResults.length) {
        resultsDropdown.innerHTML = '<div class="result-row muted">No matching sites</div>';
        resultsDropdown.classList.add('open');
        return;
    }
    resultsDropdown.innerHTML = filteredResults.map((s, i) =>
        `<div class="result-row" data-i="${i}"><span class="state-tag">${escapeHtml(s.state)}</span><span class="code">${escapeHtml(s.site_code || '')}</span>${escapeHtml(s.name)}</div>`
    ).join('');
    resultsDropdown.classList.add('open');
    resultsDropdown.querySelectorAll('.result-row[data-i]').forEach(row => {
        row.addEventListener('click', () => selectSite(filteredResults[+row.dataset.i]));
    });
}
searchInput.addEventListener('input', runSearch);
stateFilter.addEventListener('change', runSearch);
document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) resultsDropdown.classList.remove('open');
});

async function selectSite(site) {
    searchInput.value = site.name;
    resultsDropdown.classList.remove('open');
    emailCard.innerHTML = '';
    output.innerHTML = '<div class="loading">Loading visit history…</div>';
    try {
        const res = await fetch(`/.netlify/functions/get-site-history?code=${encodeURIComponent(site.site_code)}`);
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || ('HTTP ' + res.status));
        siteVisits = data.visits || [];
        renderVisitList(site, data.visits || []);
    } catch (err) {
        output.innerHTML = `<div class="empty-state" style="color:#ff9a9a;">Error loading history: ${err.message}</div>`;
    }
}

function renderVisitList(site, visits) {
    let html = `<div class="card">
        <h2>${escapeHtml(site.name)}</h2>
        <div class="meta">${escapeHtml(site.state)} · ${escapeHtml(site.site_code || '')}</div>
        <h3 class="section-label">Pick a Visit to Reconstruct</h3>`;
    if (!visits.length) {
        html += '<div class="empty-state">No visit history for this site yet.</div>';
    } else {
        html += visits.map((v, i) => {
            const dateSource = v.started_at || v.ended_at;
            const date = dateSource ? new Date(dateSource).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'Unknown date';
            const hasNote = !!v.closing_note;
            return `<div class="visit-row${hasNote ? '' : ' no-note'}" ${hasNote ? `onclick="generateEmail(${i})"` : ''}>
                <strong>${date}</strong> — ${escapeHtml(v.tech_name_raw || 'Unknown tech')} · ${escapeHtml(v.remediation || 'Service')}
                ${v.wo_number ? `<span class="mono"> WO ${escapeHtml(v.wo_number)}</span>` : ''}
                <span class="note-badge ${hasNote ? 'yes' : 'no'}">${hasNote ? 'Note captured' : 'No note'}</span>
            </div>`;
        }).join('');
    }
    html += `</div>`;
    output.innerHTML = html;
}

function fmtDate(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}
function fmtTime(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

// Fields with no current data source (Component, Contact, Issue, Travel
// Time, Mileage, PCI/rogue-device/card-reader) are omitted entirely per
// Mark's call, rather than shown blank -- only fields we actually have
// data for appear in the reconstructed email.
function generateEmail(i) {
    const v = siteVisits[i];
    const subject = `ITI Technician Service Response - Ticket #${v.wo_number || '?'} from ${v.tech_name_raw || 'Unknown'} (TW)`;
    const lines = [
        `Service Call Date: ${fmtDate(v.started_at)}`,
        `Technician: ${v.tech_name_raw || ''}`,
        `Location: ${searchInput.value}`,
        `Ticket Number: ${v.wo_number || ''}`,
        `Call Type: ${v.remediation || ''}${v.remediation_detail ? ' — ' + v.remediation_detail : ''}`,
        `Status: CLOSED`,
        ``,
        `Resolution and Notes:`,
        v.closing_note || '',
        ``,
        `Arrival Time: ${fmtTime(v.started_at)}`,
        `End Time: ${fmtTime(v.ended_at)}`
    ];
    emailCard.innerHTML = `<div class="card">
        <h3 class="section-label">Reconstructed Closing Email</h3>
        <div class="meta">Editable before sending — this is a best-effort reconstruction from captured data, not the original Neumo email.</div>
        <input type="text" id="subjectOutput" value="${escapeHtml(subject)}">
        <textarea id="emailOutput">${escapeHtml(lines.join('\n'))}</textarea>
        <div>
            <button class="primary-btn" onclick="copyEmail()">📋 Copy Body</button>
            <button class="secondary-btn" onclick="copySubject()">Copy Subject</button>
        </div>
        <div id="copyStatus" class="muted" style="margin-top:8px;font-size:12px;"></div>
    </div>`;
    emailCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function copyEmail() {
    const el = document.getElementById('emailOutput');
    try {
        await navigator.clipboard.writeText(el.value);
        document.getElementById('copyStatus').textContent = 'Body copied.';
    } catch {
        el.select();
        document.getElementById('copyStatus').textContent = 'Select-and-copy manually (clipboard access blocked).';
    }
}
async function copySubject() {
    const el = document.getElementById('subjectOutput');
    try {
        await navigator.clipboard.writeText(el.value);
        document.getElementById('copyStatus').textContent = 'Subject copied.';
    } catch {
        el.select();
        document.getElementById('copyStatus').textContent = 'Select-and-copy manually (clipboard access blocked).';
    }
}
</script>
</body>
</html>
