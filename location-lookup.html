<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Location Lookup — MCR Dispatch</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0 auto; padding: 16px;
        background: #f3f5f8; color: #1f2933;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        max-width: 1100px;
    }
    @media (min-width: 1100px) {
        body { max-width: 1400px; padding: 24px 32px 48px; }
    }
    @media (min-width: 1500px) {
        body { max-width: 1600px; padding: 28px 40px 56px; }
    }
    h1 { font-size: 22px; margin: 0 0 4px; color: #1f3a5f; }
    .subtitle { color: #6b7785; font-size: 14px; margin-bottom: 18px; }
    a.back-link { color: #1a56a8; text-decoration: none; font-size: 14px; font-weight: 600; }
    a.back-link:hover { text-decoration: underline; }
    .filters {
        display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
        background: #ffffff; border: 1px solid #dfe3e8; border-radius: 10px;
        box-shadow: 0 1px 4px rgba(16,24,40,0.06);
        padding: 14px; margin: 16px 0;
    }
    .filters label { font-size: 13px; color: #52606d; font-weight: 600; }
    select, input[type=text], input[type=date] {
        background: #ffffff; color: #1f2933; border: 1px solid #c5cdd8;
        border-radius: 6px; padding: 8px 10px; font-size: 14px;
    }
    select:focus, input[type=text]:focus, input[type=date]:focus {
        outline: none; border-color: #1a56a8; box-shadow: 0 0 0 2px rgba(26,86,168,0.15);
    }
    #searchInput { flex: 1; min-width: 220px; }
    .search-wrap { position: relative; flex: 1; min-width: 220px; }
    .results-dropdown {
        position: absolute; top: 100%; left: 0; right: 0; z-index: 20;
        background: #ffffff; border: 1px solid #c5cdd8; border-top: none;
        box-shadow: 0 6px 16px rgba(16,24,40,0.12);
        border-radius: 0 0 8px 8px; max-height: 320px; overflow-y: auto;
        display: none;
    }
    .results-dropdown.open { display: block; }
    .result-row {
        padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #e3e8ee;
        font-size: 13.5px;
    }
    .result-row:hover, .result-row.active { background: #eef2f7; }
    .result-row .code { color: #1a56a8; font-weight: 600; margin-right: 8px; }
    .result-row .state-tag {
        display: inline-block; font-size: 11px; font-weight: 700; color: #ffffff;
        background: #2f5f8f; padding: 1px 6px; border-radius: 4px; margin-right: 8px;
    }
    .card {
        background: #ffffff; border: 1px solid #dfe3e8; border-radius: 10px;
        box-shadow: 0 1px 4px rgba(16,24,40,0.06);
        padding: 18px; margin-top: 18px;
    }
    .card h2 { font-size: 18px; margin: 0 0 4px; color: #1f3a5f; }
    .card .meta { color: #6b7785; font-size: 13px; margin-bottom: 14px; }
    .visit-row, .ship-row {
        padding: 10px 0; border-bottom: 1px solid #e3e8ee; font-size: 13.5px;
    }
    .visit-row:last-child, .ship-row:last-child { border-bottom: none; }
    .kind-restock { color: #2f6f3d; font-weight: 600; }
    .kind-service { color: #9b3b3b; font-weight: 600; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: #3e4c59; }
    .muted { color: #6b7785; }
    a.ups-link { color: #1a56a8; }
    .empty-state { text-align: center; color: #6b7785; padding: 30px 0; }
    .empty-state.error { color: #9b3b3b; }
    .loading { text-align: center; color: #6b7785; padding: 20px 0; }
    h3.section-label { font-size: 13px; color: #52606d; margin: 18px 0 6px; text-transform: uppercase; letter-spacing: 0.04em; }

    /* Shared button look (also used by the buttons that were previously
       styled with inline dark-theme colors). */
    .toggle-btn, .btn-secondary {
        background: #ffffff; color: #1f3a5f; border: 1px solid #c5cdd8;
        border-radius: 6px; padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .toggle-btn:hover, .btn-secondary:hover { background: #f3f5f8; }
    .toggle-btn:disabled, .btn-secondary:disabled { opacity: 0.6; cursor: default; }
    .btn-full { width: 100%; margin-top: 10px; padding: 10px; }
    .btn-nowrap { white-space: nowrap; padding: 6px 10px; font-size: 12px; }

    .link-btn {
        background: none; border: none; padding: 0; cursor: pointer;
        font-family: inherit; font-weight: 600; text-decoration: underline;
    }
    .link-email { color: #1a56a8; }
    .link-note { color: #2f6f3d; }
    .note-badge {
        display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px;
        border-radius: 4px; margin-top: 4px; color: #ffffff;
    }
    .note-badge.yes { background: #3d7a4a; }
    .note-badge.no { background: #e9edf2; color: #6b7785; }
</style>
</head>
<body>
    <a href="/" class="back-link">← Back to Dispatch Tool</a>
    <h1>🔍 Location Lookup</h1>
    <div class="subtitle">Search any service location directly and see its closed-ticket history and related shipments — no need to have it on today's board first.</div>

    <div class="filters">
        <label>State:</label>
        <select id="stateFilter">
            <option value="">All states</option>
        </select>
        <div class="search-wrap">
            <input type="text" id="searchInput" placeholder="Search by name or site code…" autocomplete="off" style="padding-right:32px;">
            <button type="button" id="searchClearBtn" aria-label="Clear search" style="display:none;position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:#6b7785;font-size:18px;line-height:1;cursor:pointer;padding:4px;">✕</button>
            <div class="results-dropdown" id="resultsDropdown"></div>
        </div>
    </div>
    <div class="filters" id="dateFilters">
        <label>Date:</label>
        <input type="date" id="dateSingle">
        <button type="button" id="useRangeBtn" class="btn-secondary">Use a range instead</button>
        <span id="rangeInputs" style="display:none;gap:10px;align-items:center;">
            <label>From:</label>
            <input type="date" id="dateFrom">
            <label>To:</label>
            <input type="date" id="dateTo">
        </span>
        <button type="button" id="clearDateBtn" class="btn-secondary">Clear date filter</button>
        <label>Technician:</label>
        <select id="techFilter"><option value="">All technicians</option></select>
    </div>

    <div id="output"></div>

<script>
let allSites = [];
let filteredResults = [];
let activeIndex = -1;

const stateFilter = document.getElementById('stateFilter');
const searchInput = document.getElementById('searchInput');
const resultsDropdown = document.getElementById('resultsDropdown');
const output = document.getElementById('output');
const dateSingle = document.getElementById('dateSingle');
const dateFrom = document.getElementById('dateFrom');
const dateTo = document.getElementById('dateTo');
const rangeInputs = document.getElementById('rangeInputs');
const useRangeBtn = document.getElementById('useRangeBtn');
const clearDateBtn = document.getElementById('clearDateBtn');
const techFilter = document.getElementById('techFilter');
let useRange = false;
let techListState = ''; // which state's tech list is currently loaded, to avoid re-fetching needlessly

useRangeBtn.addEventListener('click', () => {
    useRange = !useRange;
    rangeInputs.style.display = useRange ? 'flex' : 'none';
    dateSingle.style.display = useRange ? 'none' : '';
    useRangeBtn.textContent = useRange ? 'Use a single day instead' : 'Use a range instead';
    runSearch();
});
clearDateBtn.addEventListener('click', () => {
    dateSingle.value = '';
    dateFrom.value = '';
    dateTo.value = '';
    runSearch();
});
dateSingle.addEventListener('change', runSearch);
dateFrom.addEventListener('change', runSearch);
dateTo.addEventListener('change', runSearch);
techFilter.addEventListener('change', runSearch);

async function loadTechsForState(state) {
    techFilter.innerHTML = '<option value="">All technicians</option>';
    if (!state) { techListState = ''; return; }
    try {
        const res = await fetch(`/.netlify/functions/get-state-techs?state=${encodeURIComponent(state)}`);
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || ('HTTP ' + res.status));
        for (const t of (data.techs || [])) {
            const opt = document.createElement('option');
            opt.value = t; opt.textContent = t;
            techFilter.appendChild(opt);
        }
        techListState = state;
    } catch (err) {
        // Non-fatal -- the feed itself still works with "All technicians"
        // if this fails, so just leave the dropdown at its default.
        techListState = '';
    }
}

function currentDateFilter() {
    if (useRange) {
        return { from: dateFrom.value || null, to: dateTo.value || null };
    }
    return { date: dateSingle.value || null };
}

async function loadSites() {
    output.innerHTML = '<div class="loading">Loading site list…</div>';
    try {
        const res = await fetch('/.netlify/functions/get-site-list');
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || ('HTTP ' + res.status));
        allSites = data.sites || [];
        const states = [...new Set(allSites.map(s => s.state))].sort();
        for (const st of states) {
            const opt = document.createElement('option');
            opt.value = st;
            opt.textContent = st;
            stateFilter.appendChild(opt);
        }
        let initial = '';
        try {
            initial = (new URLSearchParams(location.search).get('state') || localStorage.getItem('lastSelectedState') || '').toUpperCase();
        } catch (e) {}
        if (initial && [...stateFilter.options].some(o => o.value === initial)) {
            stateFilter.value = initial;
            showStateLocations(initial);
        } else {
            output.innerHTML = `<div class="empty-state">${allSites.length} sites loaded. Select a state to list locations, or start typing a name or code above.</div>`;
        }
    } catch (err) {
        output.innerHTML = `<div class="empty-state error">Error loading site list: ${err.message}</div>`;
    }
}
loadSites();

function escapeHtml(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}


function showStateLocations(st) {
    const sites = allSites.filter(s => s.state === st).sort((a, b) => String(a.site_code || '').localeCompare(String(b.site_code || '')));
    if (!sites.length) {
        output.innerHTML = `<div class="empty-state">No locations for ${escapeHtml(st)}.</div>`;
        return;
    }
    output.innerHTML = `<div class="empty-state" style="text-align:left;padding-bottom:8px;">${sites.length} locations in ${escapeHtml(st)}</div>` +
        sites.map(s => `<div class="result-row state-location" data-code="${escapeHtml(s.site_code || '')}"><span class="state-tag">${escapeHtml(s.state)}</span><span class="code">${escapeHtml(s.site_code || '')}</span>${escapeHtml(s.name)}</div>`).join('');
    output.querySelectorAll('.state-location').forEach(row => {
        row.addEventListener('click', () => {
            const site = allSites.find(s => s.state === st && s.site_code === row.dataset.code);
            if (site) selectSite(site);
        });
    });
}

function runSearch() {
    const q = searchInput.value.trim().toLowerCase();
    const st = stateFilter.value;
    activeIndex = -1;
    // 2026-09-23: picking a suggested result fills the whole box with
    // "CODE - Name" (see selectSite below) -- searching again previously
    // meant backspacing the entire thing first. This button just clears
    // the box and re-runs the same empty-query path runSearch already
    // has (state-browse or the "select a state" prompt), so it's not a
    // separate reset path to maintain.
    searchClearBtn.style.display = searchInput.value ? 'block' : 'none';
    if (!q) {
        // 2026-09-12: previously an empty box with a state picked just
        // listed that state's sites alphabetically in the dropdown -- Mark
        // wanted to browse recent VISITS (newest first) directly instead,
        // to spot which ones have captured closing notes without knowing
        // which site to search for first. Now renders into the main output
        // area (a real list, not the small dropdown) via get-recent-visits.
        resultsDropdown.classList.remove('open');
        resultsDropdown.innerHTML = '';
        if (st) {
            showStateLocations(st);
        } else {
            output.innerHTML = `<div class="empty-state">${allSites.length} sites loaded. Select a state to list locations, or start typing a name or code above.</div>`;
        }
        return;
    }
    filteredResults = allSites.filter(s => {
        if (st && s.state !== st) return false;
        return (s.name || '').toLowerCase().includes(q) || (s.site_code || '').toLowerCase().includes(q);
    }).slice(0, 40);

    if (!filteredResults.length) {
        resultsDropdown.innerHTML = '<div class="result-row muted">No matches</div>';
        resultsDropdown.classList.add('open');
        return;
    }
    resultsDropdown.innerHTML = filteredResults.map((s, i) =>
        `<div class="result-row" data-i="${i}"><span class="state-tag">${escapeHtml(s.state)}</span><span class="code">${escapeHtml(s.site_code || '')}</span>${escapeHtml(s.name)}</div>`
    ).join('');
    resultsDropdown.classList.add('open');
    resultsDropdown.querySelectorAll('.result-row[data-i]').forEach(row => {
        row.addEventListener('click', () => selectSite(filteredResults[+row.dataset.i]));
    });
}

searchInput.addEventListener('input', runSearch);
searchInput.addEventListener('focus', runSearch);
const searchClearBtn = document.getElementById('searchClearBtn');
searchClearBtn.addEventListener('click', () => {
    searchInput.value = '';
    runSearch();
    searchInput.focus();
});
stateFilter.addEventListener('change', async () => {
    await loadTechsForState(stateFilter.value);
    runSearch();
});

searchInput.addEventListener('keydown', (e) => {
    const rows = resultsDropdown.querySelectorAll('.result-row[data-i]');
    if (!rows.length) return;
    if (e.key === 'ArrowDown') {
        e.preventDefault();
        activeIndex = Math.min(activeIndex + 1, rows.length - 1);
        rows.forEach(r => r.classList.remove('active'));
        rows[activeIndex].classList.add('active');
        rows[activeIndex].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        activeIndex = Math.max(activeIndex - 1, 0);
        rows.forEach(r => r.classList.remove('active'));
        rows[activeIndex].classList.add('active');
        rows[activeIndex].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter' && activeIndex >= 0) {
        e.preventDefault();
        selectSite(filteredResults[activeIndex]);
    }
});

document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) resultsDropdown.classList.remove('open');
});

let historyState = null; // { code, visits, hasMore, totalVisits, shipments }
let feedState = null; // { state, visits, hasMore, total }

function dateFilterQueryString() {
    const f = currentDateFilter();
    const parts = [];
    if (f.date) parts.push('date=' + encodeURIComponent(f.date));
    if (f.from) parts.push('from=' + encodeURIComponent(f.from));
    if (f.to) parts.push('to=' + encodeURIComponent(f.to));
    if (techFilter.value) parts.push('tech=' + encodeURIComponent(techFilter.value));
    return parts.length ? '&' + parts.join('&') : '';
}

async function loadStateFeed(state, offset) {
    if (offset === 0) output.innerHTML = '<div class="loading">Loading recent visits…</div>';
    try {
        const res = await fetch(`/.netlify/functions/get-recent-visits?state=${encodeURIComponent(state)}&offset=${offset}${dateFilterQueryString()}`);
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || ('HTTP ' + res.status));
        if (offset === 0) {
            feedState = { state, visits: data.visits, hasMore: data.hasMore, total: data.total };
        } else {
            feedState.visits = feedState.visits.concat(data.visits);
            feedState.hasMore = data.hasMore;
        }
        renderStateFeed();
    } catch (err) {
        output.innerHTML = `<div class="empty-state error">Error loading visits: ${err.message}</div>`;
    }
}

async function loadMoreStateFeed() {
    const btn = document.getElementById('loadMoreFeedBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Loading…'; }
    await loadStateFeed(feedState.state, feedState.visits.length);
}

function renderStateFeed() {
    if (!feedState.visits.length) {
        output.innerHTML = `<div class="empty-state">No visits found for ${escapeHtml(feedState.state)}${dateFilterQueryString() ? ' in that date range' : ''}.</div>`;
        return;
    }
    let html = `<div class="card"><h3 class="section-label">Recent Visits — ${escapeHtml(feedState.state)}${feedState.total != null ? ` (${feedState.total} total)` : ''}</h3>`;
    html += feedState.visits.map(v => {
        const dateSource = v.started_at || v.ended_at;
        const date = dateSource ? new Date(dateSource).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'Unknown date';
        const isRestockLike = v.is_restock || /preventative/i.test(v.remediation || '');
        const kindClass = isRestockLike ? 'kind-restock' : 'kind-service';
        const kindLabel = isRestockLike ? 'Restock' : (v.remediation || 'Service');
        const hasNote = !!v.closing_note;
        return `<div class="visit-row" style="cursor:pointer;" onclick='feedSelectSite(${JSON.stringify(v.site_code)}, ${JSON.stringify(v.site_name)})'>
            <div><strong>${date}</strong> — <span class="${kindClass}">${escapeHtml(kindLabel)}</span> · <span class="mono">${escapeHtml(v.site_name || 'Unknown site')}</span></div>
            <div class="muted">${escapeHtml(v.tech_name_raw || 'Unknown tech')}${v.remediation_detail ? ' — ' + escapeHtml(v.remediation_detail) : ''}</div>
            ${v.appointment_number ? `<div class="mono">${escapeHtml(v.appointment_number)}${v.wo_number ? ' · WO ' + escapeHtml(v.wo_number) : ''}</div>` : ''}
            <span class="note-badge ${hasNote ? 'yes' : 'no'}">${hasNote ? 'Note captured' : 'No note yet'}</span>
        </div>`;
    }).join('');
    if (feedState.hasMore) {
        html += `<button id="loadMoreFeedBtn" class="toggle-btn btn-full" onclick="loadMoreStateFeed()">Load 50 more${feedState.total != null ? ` (${feedState.total - feedState.visits.length} remaining)` : ''}</button>`;
    }
    html += `</div>`;
    output.innerHTML = html;
}

// Tapping a visit row in the state-wide feed drills into that site's full
// history, reusing the existing site-search selectSite() flow -- keeps one
// history-rendering code path instead of building a second one.
function feedSelectSite(siteCode, siteName) {
    if (!siteCode) return;
    const site = allSites.find(s => s.site_code === siteCode) || { site_code: siteCode, name: siteName, state: feedState.state };
    selectSite(site);
}

async function selectSite(site) {
    if (!site || !site.site_code) return;
    searchInput.value = `${site.site_code} - ${site.name}`;
    resultsDropdown.classList.remove('open');
    output.innerHTML = '<div class="loading">Loading history…</div>';
    try {
        const res = await fetch('/.netlify/functions/get-site-history?code=' + encodeURIComponent(site.site_code));
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || ('HTTP ' + res.status));
        if (!data.visits.length) {
            output.innerHTML = `<div class="card"><h2>${escapeHtml(data.site.name)}</h2><div class="meta">${escapeHtml(data.site.state)} · ${escapeHtml(data.site.code)}</div><div class="empty-state">No visit history found for this site yet.</div></div>`;
            historyState = null;
            return;
        }
        historyState = {
            code: site.site_code,
            siteInfo: data.site,
            visits: data.visits,
            hasMore: data.hasMore,
            totalVisits: data.totalVisits,
            shipments: data.shipments || [],
        };
        renderHistory();
    } catch (err) {
        output.innerHTML = `<div class="empty-state error">Error loading history: ${err.message}</div>`;
    }
}

async function loadMoreHistory() {
    const btn = document.getElementById('loadMoreBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Loading…'; }
    try {
        const res = await fetch('/.netlify/functions/get-site-history?code=' + encodeURIComponent(historyState.code) + '&offset=' + historyState.visits.length);
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || ('HTTP ' + res.status));
        historyState.visits = historyState.visits.concat(data.visits);
        historyState.hasMore = data.hasMore;
        historyState.totalVisits = data.totalVisits;
        const seen = new Set(historyState.shipments.map(s => s.wo_number + '|' + s.outbound_tracking));
        for (const s of (data.shipments || [])) {
            const key = s.wo_number + '|' + s.outbound_tracking;
            if (!seen.has(key)) { historyState.shipments.push(s); seen.add(key); }
        }
        renderHistory();
    } catch (err) {
        if (btn) { btn.disabled = false; btn.textContent = 'Error loading more — tap to retry'; }
    }
}

function upsLink(num) {
    return `<a class="ups-link" href="https://www.ups.com/track?loc=en_US&tracknum=${encodeURIComponent(num)}" target="_blank" rel="noopener">${escapeHtml(num)}</a>`;
}

// 2026-08-27: ported from index.html/state.html -- location-lookup.html
// calls the same get-site-history.js backend, which already returns
// inbound_email_id per visit.
async function viewSourceEmail(inboundEmailId) {
    let overlay = document.getElementById('sourceEmailOverlay');
    if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'sourceEmailOverlay';
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:10000;display:flex;align-items:center;justify-content:center;padding:16px;';
        overlay.innerHTML = `<div style="background:#fff;color:#1a1a1a;border-radius:8px;max-width:640px;width:100%;max-height:85vh;overflow-y:auto;padding:20px;position:relative;">
            <button onclick="closeSourceEmail()" style="position:absolute;top:12px;right:14px;background:none;border:none;font-size:20px;cursor:pointer;color:#666;">✕</button>
            <div id="sourceEmailBody">Loading…</div>
        </div>`;
        document.body.appendChild(overlay);
    }
    const body = document.getElementById('sourceEmailBody');
    body.textContent = 'Loading…';
    try {
        const res = await fetch('/.netlify/functions/get-source-email?id=' + encodeURIComponent(inboundEmailId));
        const data = await res.json();
        if (!data.ok) { body.textContent = 'Failed to load email: ' + (data.error || 'unknown error'); return; }
        const dateStr = data.receivedAt ? new Date(data.receivedAt).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
        body.innerHTML = `
            <div style="font-weight:600;font-size:16px;margin-bottom:4px;padding-right:24px;">${escapeHtml(data.subject)}</div>
            <div style="color:#666;font-size:13px;margin-bottom:12px;">${data.sender ? escapeHtml(data.sender) + ' · ' : ''}${dateStr}</div>
            <div style="white-space:pre-wrap;font-size:14px;line-height:1.5;border-top:1px solid #eee;padding-top:12px;">${escapeHtml(data.bodyText) || '<span style="color:#999;">(empty body)</span>'}</div>
        `;
    } catch (e) {
        body.textContent = 'Failed to load email: ' + e.message;
    }
}

function closeSourceEmail() {
    const overlay = document.getElementById('sourceEmailOverlay');
    if (overlay) overlay.remove();
    document.body.style.overflow = '';
}

// 2026-09-12: separate from viewSourceEmail -- clicking the SA number still
// opens the original dispatch email as before; this is a second, distinct
// button ("📝 View Note") for the captured Salesforce closing note text,
// which isn't part of that email at all. Reuses the same overlay/close
// plumbing since no note text needs fetching (it's already in the visit
// object), just a different body render.
function viewClosingNoteInline(noteText, title, meta) {
    let overlay = document.getElementById('sourceEmailOverlay');
    if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'sourceEmailOverlay';
        overlay.innerHTML = `<div style="background:#fff;color:#1a1a1a;border-radius:10px;max-width:640px;width:100%;max-height:calc(100dvh - 20px);overflow-y:auto;padding:18px 16px 20px;position:relative;box-sizing:border-box;margin:0;">
            <button onclick="closeSourceEmail()" style="position:absolute;top:10px;right:10px;background:#eee;border:none;border-radius:16px;width:32px;height:32px;font-size:18px;cursor:pointer;color:#333;">✕</button>
            <div id="sourceEmailBody">Loading…</div>
        </div>`;
        document.body.appendChild(overlay);
    }
    overlay.style.cssText = 'position:fixed;inset:0;width:100vw;height:100dvh;background:rgba(0,0,0,0.6);z-index:2147483647;display:flex;align-items:flex-start;justify-content:center;padding:12px;padding-top:max(12px,env(safe-area-inset-top));overflow-y:auto;-webkit-overflow-scrolling:touch;box-sizing:border-box;';
    document.body.appendChild(overlay);
    document.body.style.overflow = 'hidden';
    window.scrollTo(0, 0);
    overlay.scrollTop = 0;
    const clean = String(noteText || '').replace(/&#x0D;|&#x0A;|&#13;|&#10;/gi, '\n');
    const body = document.getElementById('sourceEmailBody');
    body.innerHTML = `
        <div style="font-weight:600;font-size:18px;margin-bottom:12px;padding-right:28px;">${escapeHtml(title || '📝 Closing Note')}</div>
        ${meta ? `<div style="font-size:12px;color:#888;margin-bottom:12px;">${escapeHtml(meta)}</div>` : ''}
        <div style="white-space:pre-wrap;font-size:17px;line-height:1.55;border-top:1px solid #eee;padding-top:12px;">${escapeHtml(clean)}</div>
    `;
}

function renderHistory() {
    const data = { site: historyState.siteInfo, visits: historyState.visits, shipments: historyState.shipments };
    let html = `<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
            <div>
                <h2 style="margin-bottom:0;">${escapeHtml(data.site.name)}</h2>
                <div class="meta">${escapeHtml(data.site.state)} · ${escapeHtml(data.site.code)}</div>
            </div>
            <button onclick="printLocationHistory()" class="btn-secondary btn-nowrap">🖨️ Save as PDF</button>
        </div>`;

    html += `<h3 class="section-label">Visit History</h3>`;
    html += data.visits.map(v => {
        const dateSource = v.started_at || v.ended_at;
        const date = dateSource ? new Date(dateSource).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'Unknown date';
        const dur = v.duration_min != null ? Math.round(v.duration_min) + ' min' : '';
        const isRestockLike = v.is_restock || /preventative/i.test(v.remediation || '');
        const kindClass = isRestockLike ? 'kind-restock' : 'kind-service';
        const kindLabel = v.source === 'bluefolder'
            ? ('BlueFolder' + (v.remediation && v.remediation !== 'BlueFolder' ? ' · ' + v.remediation : ''))
            : v.source === 'email_ticket'
              ? (v.remediation || 'Ticket')
              : (isRestockLike ? 'Restock' : (v.remediation || 'Service'));
        const reviewNote = v.needs_review ? ' <span class="muted">(site match unconfirmed)</span>' : '';
        const saDisplay = v.appointment_number
            ? (v.inbound_email_id
                ? `<div class="mono"><button onclick="viewSourceEmail('${v.inbound_email_id}')" class="link-btn link-email" style="font-size:inherit;">${escapeHtml(v.appointment_number)}</button></div>`
                : `<div class="mono" style="color:#1f2933;font-weight:600;">${escapeHtml(v.appointment_number)}</div>`)
            : '';
        const metaStr = [date, v.tech_name_raw, v.wo_number ? ((v.source === 'bluefolder' ? 'BF ' : 'WO ') + v.wo_number) : null].filter(Boolean).join(' · ');
        return `<div class="visit-row">
            <div><strong>${date}</strong> — <span class="${kindClass}">${escapeHtml(kindLabel)}</span>${dur ? ' · ' + dur : ''}</div>
            <div class="muted">${escapeHtml(v.tech_name_raw || 'Unknown tech')}${v.remediation_detail ? ' — ' + escapeHtml(v.remediation_detail) : ''}${reviewNote}</div>
            ${saDisplay}
            ${v.wo_number ? `<div class="mono">${v.source === 'bluefolder' ? 'BF ' : 'WO '}${escapeHtml(v.wo_number)}${v.ticket_status ? ' · ' + escapeHtml(v.ticket_status) : ''}</div>` : ''}
            ${v.source === 'email_ticket' && v.inbound_email_id ? `<button onclick="viewSourceEmail('${v.inbound_email_id}')" class="link-btn link-email" style="margin-top:4px;font-size:12px;">✉️ View ticket email</button>` : ''}
            ${v.closing_note ? `<button onclick="viewClosingNoteInline(decodeURIComponent('${encodeURIComponent(v.closing_note).replace(/'/g, '%27')}'), '${v.source === 'bluefolder' ? '📁 BlueFolder note' : '📝 Closing Note'}', decodeURIComponent('${encodeURIComponent(metaStr).replace(/'/g, '%27')}'))" class="link-btn link-note" style="margin-top:4px;font-size:12px;">${v.source === 'bluefolder' ? '📁 View BlueFolder note' : '📝 View Note'}</button>` : ''}
        </div>`;
    }).join('');

    if (historyState.hasMore) {
        html += `<button id="loadMoreBtn" class="toggle-btn btn-full" onclick="loadMoreHistory()">Load 15 more (${historyState.totalVisits - historyState.visits.length} remaining)</button>`;
    }

    if (data.shipments && data.shipments.length) {
        html += `<h3 class="section-label">Related Shipments</h3>`;
        html += data.shipments.map(s => {
            const date = s.received_at ? new Date(s.received_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'Unknown date';
            const returnStatus = s.return_broken_part
                ? (s.returned_at ? `<span class="kind-restock">Returned ${new Date(s.returned_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</span>` : `<span class="kind-service">Return still needed</span>`)
                : '';
            const parts = [];
            if (s.outbound_tracking) parts.push('Out: ' + upsLink(s.outbound_tracking));
            if (s.inbound_tracking) parts.push('In: ' + upsLink(s.inbound_tracking));
            return `<div class="ship-row">
                <div><strong>${date}</strong> — WO ${escapeHtml(s.wo_number || '?')}${s.warehouse_name ? ' · ' + escapeHtml(s.warehouse_name) : ''}</div>
                <div class="mono">${parts.join(' · ')}</div>
                ${returnStatus ? `<div>${returnStatus}</div>` : ''}
            </div>`;
        }).join('');
    }

    html += `</div>`;
    output.innerHTML = html;
}

async function printLocationHistory() {
    if (!historyState || !historyState.visits.length) {
        alert('No visit history loaded to export yet.');
        return;
    }
    const btn = event && event.target;
    if (btn) { btn.disabled = true; btn.textContent = 'Loading…'; }
    try {
        while (historyState.hasMore) {
            await loadMoreHistory();
        }
    } finally {
        if (btn) { btn.disabled = false; btn.textContent = '🖨️ Save as PDF'; }
    }

    const st = historyState;
    const generatedOn = new Date().toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric', year:'numeric' });
    const titleText = `Visit History — ${st.siteInfo.name} (${st.siteInfo.code})`;

    let content = `<div class="print-header">
        <div class="print-title">${titleText}</div>
        <div class="print-date">Exported ${generatedOn} · ${st.totalVisits || st.visits.length} visits</div>
    </div>`;

    content += st.visits.map(v => {
        const dateSource = v.started_at || v.ended_at;
        const date = dateSource ? new Date(dateSource).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'Unknown date';
        const dur = v.duration_min != null ? Math.round(v.duration_min) + ' min' : '';
        const isRestockLike = v.is_restock || /preventative/i.test(v.remediation || '');
        const kindColor = isRestockLike ? '#2e7d32' : '#c62828';
        const kindLabel = isRestockLike ? 'Restock' : (v.remediation || 'Service');
        const reviewNote = v.needs_review ? ' <span style="color:#999;font-size:11px;">(site match unconfirmed)</span>' : '';
        return `<div class="print-stop">
            <div><strong>${date}</strong> — <span style="color:${kindColor};">${escapeHtml(kindLabel)}</span>${dur ? ' · ' + dur : ''}</div>
            <div class="print-stop-addr">${escapeHtml(v.tech_name_raw || 'Unknown tech')}${v.remediation_detail ? ' — ' + escapeHtml(v.remediation_detail) : ''}${reviewNote}</div>
            ${v.appointment_number ? `<div style="color:#333;font-weight:600;">${escapeHtml(v.appointment_number)}</div>` : ''}
            ${v.wo_number ? `<div style="color:#999;font-size:11px;">WO ${escapeHtml(v.wo_number)}</div>` : ''}
        </div>`;
    }).join('');

    if (st.shipments && st.shipments.length) {
        content += `<h4 style="margin:16px 0 4px;">Related Shipments</h4>`;
        content += st.shipments.map(s => {
            const date = s.received_at ? new Date(s.received_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'Unknown date';
            const returnStatus = s.return_broken_part
                ? (s.returned_at ? '<span style="color:#2e7d32;">Returned ' + new Date(s.returned_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + '</span>' : '<span style="color:#c62828;">Return still needed</span>')
                : '';
            const trackingParts = [];
            if (s.outbound_tracking) trackingParts.push('Out: ' + s.outbound_tracking);
            if (s.inbound_tracking) trackingParts.push('In: ' + s.inbound_tracking);
            return `<div class="print-stop">
                <div><strong>${date}</strong> — WO ${escapeHtml(s.wo_number || '?')}${s.warehouse_name ? ' · ' + escapeHtml(s.warehouse_name) : ''}</div>
                <div class="print-stop-addr">${trackingParts.join(' · ')}</div>
                ${returnStatus ? `<div>${returnStatus}</div>` : ''}
            </div>`;
        }).join('');
    }

    const docTitle = titleText.replace(/[^\w\s-]/g, '').replace(/\s+/g, '_');
    const html = `<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${docTitle}</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 16px; font-size: 15px; color: #222; max-width: 700px; margin: 0 auto; }
  .print-btn { display: block; width: 100%; padding: 14px; background: #1a56a8; color: white; border: none; border-radius: 8px; font-size: 17px; font-weight: 600; margin-bottom: 16px; cursor: pointer; }
  .print-header { margin-bottom: 16px; border-bottom: 2px solid #333; padding-bottom: 8px; }
  .print-title { font-size: 20px; font-weight: bold; }
  .print-date { font-size: 14px; color: #555; margin-top: 2px; }
  .print-stop { padding: 8px 0; border-bottom: 1px solid #eee; }
  .print-stop:last-child { border-bottom: none; }
  .print-stop-addr { font-size: 13px; color: #555; margin-top: 2px; }
  @media print { .print-btn { display: none; } body { padding: 0; } }
</style>
</head><body>
<button class="print-btn" onclick="window.print()">🖨️ Save as PDF / Print</button>
${content}</body></html>`;

    const blob = new Blob([html], { type: 'text/html' });
    const blobUrl = URL.createObjectURL(blob);
    const printWin = window.open(blobUrl, '_blank');
    if (!printWin) {
        alert('Please allow popups to export this, or long-press the Save as PDF button and choose "Open in new tab".');
        URL.revokeObjectURL(blobUrl);
        return;
    }
    setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
}
</script>
</body>
</html>
