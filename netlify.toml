[build]
  publish = "."
  functions = "netlify/functions"

[functions."salesforce-report-sync-trigger"]
  schedule = "*/20 * * * *"

[functions."check-report-sync-health"]
  schedule = "15,35,55 * * * *"

[functions."pull-mailbox"]
  timeout = 26

[functions."pull-shipments-mailbox"]
  timeout = 26
  schedule = "*/20 * * * *"

# 2026-10-06: on-demand twin of the shipments mailbox poll above. Netlify blocks
# direct URL calls to a scheduled function, so this unscheduled copy runs the very
# same code when opened in a browser and shows what happened (found / inserted / errors).
[functions."pull-shipments-now"]
  timeout = 26

[functions."closings-sync"]
  timeout = 26
  schedule = "0 */2 * * *"


# 2026-09-08: disabled by Mark -- real-time SMS delivery may be starting to
# work again after the Verizon block, and he doesn't want a batched morning
# digest (queued from overnight/off-hours tickets) sending several texts at
# once, since that's the exact pattern that triggered the original block.
# Queuing logic in mailgun-inbound.js is untouched -- items still queue into
# pending-notifications, they just won't be flushed until this schedule is
# restored. Re-add the block below to turn it back on:
# [functions."send-notification-digests"]
#   schedule = "*/15 * * * *"

[functions."get-distance-matrix"]
  timeout = 26

# Date-fix texts. The public function has no schedule (Netlify blocks those).
# This wrapper is the 10-minute check. It does nothing until the board switch is on.
[functions."run-inventory-date-text"]
  schedule = "*/10 * * * *"

# 2026-10-10: reset-saturday-alerts was written to switch off Saturday on-call alert
# rows after their day's 5pm cutoff, but it was never given a schedule, so rows from
# Oct 3 stayed active. Hourly is enough: the rows' own 08:00-17:00 window already
# blocks texts after 5pm, this just turns them off before the next weekday.
[functions."reset-saturday-alerts"]
  schedule = "7 * * * *"
