<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inbound Mail — MCR Dispatch</title>
<style>
  :root {
    --bg: #111218;
    --panel: #1a1b24;
    --panel2: #222333;
    --border: #33344a;
    --text: #e8e8ef;
    --muted: #9aa0b5;
    --accent: #7edb8e;
    --trouble: #ef4444;
    --restock: #3b82f6;
    --maint: #f59e0b;
    --other: #8b8b9a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 12px 14px 8px; border-bottom: 1px solid var(--border);
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  header h1 { font-size: 1.15rem; margin: 0 8px 0 0; font-weight: 650; }
  .back {
    background: #6c757d; color: #fff; text-decoration: none; font-weight: 600;
    padding: 8px 12px; border-radius: 8px; font-size: 14px;
  }
  .hint { color: var(--muted); font-size: 12px; width: 100%; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 14px;
    border-bottom: 1px solid var(--border); align-items: center;
  }
  select, input[type="search"], button {
    font-size: 15px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid #555; background: #222; color: var(--text);
  }
  button { background: #2563eb; border-color: #2563eb; cursor: pointer; font-weight: 600; }
  button.ghost { background: #2a2a3e; border-color: #444; }
  .layout { display: flex; min-height: calc(100vh - 130px); }
  .boxes {
    width: 170px; flex-shrink: 0; border-right: 1px solid var(--border);
    padding: 10px 8px; background: var(--panel);
  }
  .boxes button {
    display: block; width: 100%; text-align: left; background: transparent;
    border: none; color: var(--text); padding: 9px 10px; margin-bottom: 4px;
    border-radius: 8px; font-weight: 600; font-size: 14px;
  }
  .boxes button.active { background: #2b3348; color: var(--accent); }
  .list {
    width: min(42vw, 420px); flex-shrink: 0; border-right: 1px solid var(--border);
    overflow-y: auto; max-height: calc(100vh - 130px);
  }
  .row {
    padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .row:hover { background: #1f2030; }
  .row.active { background: #25263a; }
  .row .subj { font-weight: 650; font-size: 14px; margin-bottom: 3px; }
  .row .meta { color: var(--muted); font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    display: inline-block; font-size: 10px; letter-spacing: .03em; text-transform: uppercase;
    padding: 2px 6px; border-radius: 4px; background: #333; color: #ddd;
  }
  .pill.trouble { background: #3a1515; color: #fca5a5; }
  .pill.restock { background: #13233d; color: #93c5fd; }
  .pill.dispatch { background: #0f2f28; color: #7edb8e; }
  .pill.maintenance { background: #3a2a10; color: #fcd34d; }
  .pill.rma { background: #2a1a3a; color: #d8b4fe; }
  .pill.other, .pill.notes { background: #2a2a2a; color: #bbb; }
  .pill.review { background: #3a2a10; color: #fde68a; }
  .pill.failed { background: #3a2a10; color: #fde68a; }
  .read {
    flex: 1; padding: 16px 18px; overflow-y: auto; max-height: calc(100vh - 130px);
    white-space: pre-wrap; font-size: 14px; line-height: 1.45;
  }
  .read h2 { font-size: 1.05rem; margin: 0 0 6px; }
  .read .who { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  #status { color: var(--muted); padding: 16px; }
  #mailOverlay {
    display: none; position: fixed; inset: 0; z-index: 10000;
    background: rgba(0,0,0,.55); padding: 12px;
    align-items: center; justify-content: center;
  }
  #mailOverlay.open { display: flex; }
  #mailPaper {
    background: #f7f4ee; color: #1a1a1a;
    width: min(720px, 100%); max-height: 90vh; overflow: auto;
    border-radius: 10px; padding: 22px 22px 28px; position: relative;
    box-shadow: 0 16px 50px rgba(0,0,0,.45);
    font-family: Georgia, 'Times New Roman', serif;
  }
  #mailPaper .x {
    position: absolute; top: 10px; right: 12px; border: none; background: none;
    font-size: 22px; cursor: pointer; color: #666;
  }
  #mailPaper .subj { font-family: -apple-system, Segoe UI, sans-serif; font-weight: 700; font-size: 17px; padding-right: 28px; }
  #mailPaper .who { font-family: -apple-system, Segoe UI, sans-serif; color: #666; font-size: 13px; margin: 6px 0 14px; }
  #mailPaper .body { font-size: 15px; line-height: 1.55; }
  #mailPaper .field { margin: 0 0 10px; }
  #mailPaper .field b {
    display: block; font-family: -apple-system, Segoe UI, sans-serif;
    font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: #6b6b6b; margin-bottom: 2px;
  }
  #mailPaper table.dlist {
    width: 100%; border-collapse: collapse; font-family: -apple-system, Segoe UI, sans-serif;
    font-size: 12px; margin: 10px 0 16px; background: #fff;
  }
  #mailPaper table.dlist th {
    text-align: left; background: #1aa3a8; color: #fff; padding: 5px 6px; font-weight: 700;
    position: sticky; top: 0;
  }
  #mailPaper table.dlist td { border-bottom: 1px solid #e6e1d6; padding: 5px 6px; vertical-align: top; }
  #mailPaper table.dlist tr:nth-child(even) td { background: #f3fbfb; }
  #mailPaper table.dlist .nums { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #mailPaper .sec {
    font-family: -apple-system, Segoe UI, sans-serif; font-weight: 800; font-size: 13px;
    background: #7ef0f5; color: #113; display: inline-block; padding: 3px 8px; margin: 12px 0 6px;
  }
  @media (max-width: 800px) {
    .layout { flex-direction: column; }
    .boxes { width: 100%; display: flex; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--border); }
    .boxes button { width: auto; white-space: nowrap; margin-right: 4px; }
    .list { width: 100%; max-height: 40vh; border-right: none; }
    .read { max-height: none; }
  }
</style>
</head>
<body>
<header>
  <a class="back" href="/">← Dispatch</a>
  <h1>Inbound Mail</h1>
  <span class="hint">Read-only copy of what Mailgun stored. No send. Bodies are cleaned of quoted chains.</span>
</header>
<div class="toolbar">
  <select id="stateSelect">
    <option value="">All states</option>
    <option value="CA">CA</option><option value="CO">CO</option>
    <option value="FL">FL</option><option value="GA">GA</option>
    <option value="ID">ID</option><option value="IL">IL</option>
    <option value="IN">IN</option><option value="MI">MI</option>
    <option value="MN">MN</option><option value="NC">NC</option>
    <option value="NV">NV</option><option value="OH">OH</option>
    <option value="OR">OR</option><option value="SC">SC</option>
    <option value="WV">WV</option>
  </select>
  <select id="parseSelect">
    <option value="">Any parse status</option>
    <option value="parsed">Parsed</option>
    <option value="failed">Failed</option>
    <option value="pending">Pending</option>
    <option value="ignored">Ignored</option>
  </select>
  <input type="search" id="q" placeholder="Search WO, site, subject…" style="flex:1;min-width:160px;">
  <button id="go">Search</button>
  <button class="ghost" id="refresh">Refresh</button>
</div>
<div class="layout">
  <nav class="boxes" id="boxes">
    <button data-box="all" class="active">All</button>
    <button data-box="trouble">Trouble</button>
    <button data-box="dispatch">Dispatch lists</button>
    <button data-box="restock">Same-day restock</button>
    <button data-box="maintenance">Maintenance</button>
    <button data-box="rma">RMA / parts</button>
    <button data-box="notes">Replies / notes</button>
    <button data-box="other">Catch-all</button>
    <button data-box="review">Unparsed archive</button>
  </nav>
  <div class="list" id="list"><div id="status">Loading…</div></div>
  <div class="read" id="read">Select a message. Tap a row for the full letter.</div>
</div>
<div id="mailOverlay" onclick="if(event.target===this) closeMailOverlay()">
  <div id="mailPaper">
    <button class="x" type="button" onclick="closeMailOverlay()">✕</button>
    <div id="mailPaperInner">Loading…</div>
  </div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  let mailbox = params.get('mailbox') || 'all';
  let selectedId = params.get('id') || null;
  let openSelectedOnce = !!params.get('id');

  const stateSelect = document.getElementById('stateSelect');
  const parseSelect = document.getElementById('parseSelect');
  const qInput = document.getElementById('q');
  if (params.get('state')) stateSelect.value = params.get('state').toUpperCase();
  if (params.get('query')) qInput.value = params.get('query');
  if (mailbox === 'dispatch' && !params.get('parseStatus')) parseSelect.value = 'parsed';
  if (params.get('parseStatus')) parseSelect.value = params.get('parseStatus');

  document.querySelectorAll('#boxes button').forEach((btn) => {
    if (btn.dataset.box === mailbox) btn.classList.add('active');
    else btn.classList.remove('active');
    btn.onclick = () => {
      mailbox = btn.dataset.box;
      document.querySelectorAll('#boxes button').forEach((b) => b.classList.toggle('active', b === btn));
      if (mailbox === 'dispatch') {
        parseSelect.value = 'parsed';
        if (/dispatch\s*list/i.test(qInput.value)) qInput.value = '';
      }
      selectedId = null;
      closeMailOverlay();
      loadList();
    };
  });

  document.getElementById('go').onclick = loadList;
  document.getElementById('refresh').onclick = loadList;
  qInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadList(); });
  stateSelect.onchange = () => { closeMailOverlay(); loadList(); };
  parseSelect.onchange = () => { closeMailOverlay(); loadList(); };

  function fmtWhen(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }

  async function loadList() {
    const list = document.getElementById('list');
    list.innerHTML = '<div id="status">Loading…</div>';
    const qs = new URLSearchParams();
    qs.set('mailbox', mailbox);
    qs.set('limit', '50');
    if (stateSelect.value && mailbox !== 'dispatch') qs.set('state', stateSelect.value);
    if (parseSelect.value) qs.set('parseStatus', parseSelect.value);
    if (qInput.value.trim()) qs.set('query', qInput.value.trim());
    try {
      const r = await fetch('/.netlify/functions/list-inbound-emails?' + qs.toString(), { cache: 'no-store' });
      const data = await r.json();
      if (!data.ok) throw new Error(data.error || 'load failed');
      if (!data.emails.length) {
        list.innerHTML = '<div id="status">No messages in this mailbox.</div>';
        return;
      }
      list.innerHTML = data.emails.map((e) => `
        <div class="row" data-id="${e.id}">
          <div class="subj">${escapeHtml(e.subject || '(no subject)')}</div>
          <div class="meta">
            <span class="pill ${e.mailbox}">${e.mailbox}</span>
            ${e.inferredState ? `<span class="pill">${e.inferredState}</span>` : ''}
            ${e.parseStatus === 'failed' ? `<span class="pill review">unparsed</span>` : (e.parseStatus && e.parseStatus !== 'parsed' ? `<span class="pill">${e.parseStatus}</span>` : '')}
            <span>${escapeHtml((e.sender || '').split('<')[0].trim())}</span>
            <span>${fmtWhen(e.receivedAt)}</span>
          </div>
        </div>
      `).join('');
      list.querySelectorAll('.row').forEach((row) => {
        row.onclick = () => openMail(row.dataset.id);
      });
      if (openSelectedOnce && selectedId) {
        openSelectedOnce = false;
        openMail(selectedId);
      } else if (selectedId) {
        list.querySelectorAll('.row').forEach((r) => r.classList.toggle('active', r.dataset.id === selectedId));
      }
    } catch (err) {
      list.innerHTML = '<div id="status">Could not load mail: ' + escapeHtml(err.message) + '</div>';
    }
  }

  const STATE_RE = 'CA|CO|FL|GA|ID|IL|IN|MI|MN|NC|NV|OH|OR|SC|WV';

  function isSurfboardCode(code) {
    return /^(FL|NC)/i.test(code);
  }

  function parseDispatchList(text) {
    // Same approach as index.html parseFormCounts: walk site codes, take a
    // window after each code, require a restock-by date, then map counts
    // LF/LR/Journal for surfboards (FL/NC) and LF/LR/RF/RR/Journal otherwise.
    const flat = String(text || '').replace(/\s+/g, ' ').trim();
    const header = /State\s+Location\s+LF\s+LR\s+RF\s+RR\s+Journal/i;
    const hm = flat.match(header);
    const intro = hm ? flat.slice(0, hm.index).trim() : '';
    const body = hm ? flat.slice(hm.index) : flat;
    if (!hm && !/Dispatch List|Restock By|Consumables Needed/i.test(body)) return null;

    const codeRe = /\b(?:[A-Z]{2}\d{3,5}|K[A-Z]\d{1,3})\b/g;
    const dateRe = /\b(\d{1,2}\/\d{1,2}\/\d{2,4})\b/;
    const consumablesRe = /\b(Journal Paper|Left Forms|Right Forms|Ribbon|P\d Forms)[^\d]*/gi;
    const rows = [];
    const seen = {};
    let match;
    while ((match = codeRe.exec(body)) !== null) {
      const code = match[0];
      if (seen[code]) continue;
      const win = body.slice(match.index + code.length, match.index + code.length + 300);
      const dateMatch = win.match(dateRe);
      if (!dateMatch) continue;
      const nums = [...win.replace(dateRe, '').matchAll(/(?<![\/.\d])(-?\d{1,4})(?![\/.\d])/g)]
        .map((x) => parseInt(x[1], 10))
        .filter((n) => n <= 9999 && n >= -99 && n !== 0);
      const sb = isSurfboardCode(code);
      if (sb ? nums.length < 2 : nums.length < 4) continue;
      const textUpToDate = win.slice(0, win.indexOf(dateMatch[0]));
      const consumablesMatch = textUpToDate.match(consumablesRe);
      const consumablesStr = consumablesMatch
        ? consumablesMatch.map((x) => x.trim()).join(', ').replace(/,\s*,/g, ',').trim()
        : '';
      const lookback = body.slice(Math.max(0, match.index - 90), match.index);
      const locM = lookback.match(new RegExp('\\b(' + STATE_RE + ')\\s+(.+)$'));
      const locName = (locM ? locM[2] : lookback).replace(/\s+/g, ' ').replace(/^[-–\s]+|[-–\s]+$/g, '');
      rows.push({
        state: locM ? locM[1] : (code.match(/^([A-Z]{2})/) || ['', ''])[1],
        loc: (locName + ' - ' + code).replace(/^\s*-\s*/, ''),
        lf: nums[0], lr: nums[1],
        rf: sb ? '—' : (nums[2] != null ? nums[2] : ''),
        rr: sb ? '—' : (nums[3] != null ? nums[3] : ''),
        journal: sb ? (nums[2] != null ? nums[2] : '') : (nums[4] != null ? nums[4] : ''),
        cons: consumablesStr,
        by: dateMatch[1]
      });
      seen[code] = true;
    }
    if (rows.length < 2) return null;
    let html = '';
    if (intro) html += '<div class="field">' + escapeHtml(intro) + '</div>';
    html += '<div class="sec">DISPATCH LIST</div>';
    html += '<div style="overflow-x:auto"><table class="dlist"><thead><tr>' +
      '<th>State</th><th>Location</th><th class="nums">LF</th><th class="nums">LR</th>' +
      '<th class="nums">RF</th><th class="nums">RR</th><th class="nums">Journal</th>' +
      '<th>Consumables</th><th>Restock by</th></tr></thead><tbody>';
    for (const r of rows) {
      html += '<tr><td>' + escapeHtml(r.state) + '</td><td>' + escapeHtml(r.loc) + '</td>' +
        '<td class="nums">' + r.lf + '</td><td class="nums">' + r.lr + '</td>' +
        '<td class="nums">' + r.rf + '</td><td class="nums">' + r.rr + '</td>' +
        '<td class="nums">' + r.journal + '</td><td>' + escapeHtml(r.cons) + '</td>' +
        '<td>' + escapeHtml(r.by) + '</td></tr>';
    }
    html += '</tbody></table></div>';
    return html;
  }

  function stripPreamble(text) {
    let t = String(text || '');
    const hello = t.search(/Hello,\s*here is today's dispatch list/i);
    if (hello >= 0) return t.slice(hello).trim();
    const subjects = [...t.matchAll(/Subject:\s*(?:Re:\s*|Fwd?:\s*)*[^\n]*Dispatch List[^\n]*/gi)];
    if (subjects.length) t = t.slice(subjects[subjects.length - 1].index + subjects[subjects.length - 1][0].length);
    const placed = t.search(/DISPATCHES NEEDING PLACED|Hello,\s*here is/i);
    const header = t.search(/State\s+Location\s+LF\s+LR/i);
    if (placed >= 0 && (header < 0 || placed < header)) return t.slice(placed).trim();
    if (header >= 0) return t.slice(header).trim();
    return t.trim();
  }

  function formatNatural(text) {
    if (!text) return '<span style="color:#888">(empty body)</span>';
    text = stripPreamble(text);
    const table = parseDispatchList(text);
    if (table) return table;
    let t = String(text).replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    // Dispatch lists often collapse to "CA San Luis Obispo" runs.
    t = t.replace(/\n(?=(CA|CO|FL|GA|ID|IL|IN|MI|MN|NC|NV|OH|OR|SC|WV)\b)/g, '\n\n');
    const labelRe = /^(Work Order Number|Priority|Earliest Start Permitted|Earliest Start|Due Date|Location|Address|Phone|Account Name|PC Name|SST Type|SST Name|Line Item Issue Category|Line Item Issue Detail|Line Item Description|Line Item Number|Out of Service|Device Errors|Consumable Counts|Restock SST|SST ID|ATM ID)\s*:\s*(.*)$/i;
    const lines = t.split('\n');
    let html = '';
    let buf = [];
    function flushBuf() {
      if (!buf.length) return;
      html += '<div class="field">' + escapeHtml(buf.join('\n')) + '</div>';
      buf = [];
    }
    for (const raw of lines) {
      const line = raw.trimEnd();
      const m = line.match(labelRe);
      if (m) {
        flushBuf();
        html += '<div class="field"><b>' + escapeHtml(m[1]) + '</b>' + escapeHtml(m[2] || '') + '</div>';
      } else {
        buf.push(line);
      }
    }
    flushBuf();
    return html;
  }

  async function openMail(id) {
    selectedId = id;
    document.querySelectorAll('.row').forEach((r) => r.classList.toggle('active', r.dataset.id === id));
    const pane = document.getElementById('read');
    const paper = document.getElementById('mailPaperInner');
    pane.textContent = 'Opening…';
    paper.textContent = 'Loading…';
    document.getElementById('mailOverlay').classList.add('open');
    try {
      const r = await fetch('/.netlify/functions/get-source-email?id=' + encodeURIComponent(id), { cache: 'no-store' });
      const data = await r.json();
      if (!data.ok) throw new Error(data.error || 'open failed');
      const who = escapeHtml(data.sender || '') + ' · ' + fmtWhen(data.receivedAt);
      pane.innerHTML = `<h2>${escapeHtml(data.subject)}</h2>
        <div class="who">${who}</div>
        <div>${escapeHtml(data.bodyText || '(empty body)')}</div>`;
      paper.innerHTML = `<div class="subj">${escapeHtml(data.subject)}</div>
        <div class="who">${who}</div>
        <div class="body">${formatNatural(data.bodyText)}</div>`;
    } catch (err) {
      pane.textContent = 'Could not open message: ' + err.message;
      paper.textContent = pane.textContent;
    }
  }

  function closeMailOverlay() {
    document.getElementById('mailOverlay').classList.remove('open');
  }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMailOverlay(); });

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  loadList();
</script>
</body>
</html>
