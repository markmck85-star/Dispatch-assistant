<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Digest – MCR Dispatch</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-text-size-adjust: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f3f5f8; color: #1f2933; padding: 15px; line-height: 1.5; font-size: 16px; }
  .container { max-width: 900px; margin: 0 auto; }
  .back-link { display: inline-block; color: #1a56a8; text-decoration: none; font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .back-link:hover { text-decoration: underline; }
  .console { background: #ffffff; border: 1px solid #dfe3e8; border-radius: 10px; box-shadow: 0 1px 4px rgba(16,24,40,0.08); padding: 18px; }
  h1 { color: #1f3a5f; font-size: 21px; margin-bottom: 2px; }
  .subtitle { color: #6b7785; font-size: 12px; margin-bottom: 14px; }
  select#stateSelect { font-size: 14px; padding: 8px 12px; border-radius: 6px; border: 1px solid #c5cdd8; background: #ffffff; color: #1f2933; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back-link">&larr; Back to Dispatch</a>
  <div class="console">
    <h1>&#128203; Daily Digest</h1>
    <div class="subtitle">Morning brief and end-of-day summary for a territory</div>
    <select id="stateSelect">
      <option value="GA">Georgia / NC / SC</option>
      <option value="CA">California</option>
      <option value="CO">Colorado</option>
      <option value="FL">Florida</option>
      <option value="ID">Idaho</option>
      <option value="IL">Illinois</option>
      <option value="IN">Indiana</option>
      <option value="MI">Michigan</option>
      <option value="MN">Minnesota</option>
      <option value="NV">Nevada</option>
      <option value="OH">Ohio</option>
      <option value="OR">Oregon</option>
      <option value="WV">West Virginia</option>
    </select>
    <div id="panelHome"></div>
  </div>
</div>
<script src="digest-panel.js"></script>
<script>
  DigestPanel.mount(document.getElementById('panelHome'), {
    theme: 'light',
    collapsible: false,
    stateSelectEl: document.getElementById('stateSelect')
  });
</script>
<script src="/update-check.js"></script>
</body>
</html>
